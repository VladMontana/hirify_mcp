[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hirify-mcp"
version = "0.1.0"
description = "MCP server for matching job vacancies from Hirify using Scrapling"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Hirify MCP Contributors" }
]
dependencies = [
    "mcp>=2.3.0",
    "scrapling[fetchers]>=0.5",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
hirify-mcp = "hirify_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hirify_mcp"]
