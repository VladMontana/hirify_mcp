[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hirify-mcp"
version = "0.2.0"
description = "Production-grade MCP server for Hirify job board matching with hard filters, smart scoring, and local application tracking"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Hirify MCP Contributors" }
]
dependencies = [
    "mcp>=2.3.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.8.0",
    "mypy>=1.10.0",
]
scrapling = [
    "scrapling[fetchers]>=0.5",
]

[project.scripts]
hirify-mcp = "hirify_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hirify_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests as requiring external Hirify API (deselect with '-m \"not integration\"')",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
